name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A6B3A6: ${{ secrets.A6B3A6 }}
          B52834: ${{ secrets.B52834 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A6B3A6', '')
          sec_b = os.environ.get('B52834', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- ab197a6a3fd356a1bf30c4 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 4f1c8be23c57f0b4eb9fc87004 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
